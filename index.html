<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Degla apartment - VR tour</title>
<style>
  html, body { margin:0; height:100%; background:#111; overflow:hidden; font-family:system-ui,Segoe UI,Roboto,sans-serif; color:#fff; touch-action:none; -webkit-user-select:none; user-select:none; }
  #c { position:fixed; inset:0; width:100%; height:100%; display:block; }
  #fade { position:fixed; inset:0; background:#000; opacity:0; pointer-events:none; transition:opacity .35s; }
  #bar { position:fixed; top:0; left:0; right:0; display:flex; flex-wrap:wrap; gap:6px; align-items:center; padding:8px 10px; background:linear-gradient(#000a,#0000); z-index:5; }
  #title { flex:1; font-size:15px; font-weight:600; text-shadow:0 1px 3px #000; }
  button { background:#ffffff26; color:#fff; border:1px solid #ffffff55; border-radius:8px; padding:8px 12px; font-size:14px; backdrop-filter:blur(6px); }
  button.on { background:#2e8bff; border-color:#2e8bff; }
  #menu { position:fixed; top:96px; right:10px; background:#000d; border-radius:10px; padding:6px; display:none; z-index:6; max-height:75vh; overflow:auto; }
  #menu div { padding:10px 14px; font-size:15px; border-radius:6px; }
  #menu div:active { background:#ffffff33; }
  #hint { position:fixed; bottom:14px; left:0; right:0; text-align:center; font-size:13px; opacity:.85; text-shadow:0 1px 3px #000; pointer-events:none; }
  #loading { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#111; z-index:9; font-size:18px; }
  body.vr #bar, body.vr #hint, body.vr #walkpad { display:none !important; }
  #walkpad { position:fixed; bottom:18px; right:18px; display:none; gap:10px; z-index:5; }
  #walkpad button { font-size:20px; padding:16px 22px; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="fade"></div>
<div id="bar">
  <div id="title">Loading...</div>
  <button id="bGyro">Gyro</button>
  <button id="bVR">Cardboard VR</button>
  <button id="bWalk">Walk (3D)</button>
  <button id="bMenu">Rooms</button>
  <button id="bHeight">Height</button>
  <button id="bClose">Eyes closer</button>
  <button id="bApart">Eyes apart</button>
</div>
<div id="menu"></div>
<div id="walkpad"><button id="wpB">&#9660;</button><button id="wpF">&#9650; Walk</button></div>
<div id="hint">Drag to look around, tap a ring to move. For the headset: tap Cardboard VR, then look at a ring for 1.5 s.</div>
<div id="loading">Loading tour...</div>
<script src="three.min.js"></script>
<script src="GLTFLoader.js"></script>
<script>
// ---------- tour data (coordinates are plan metres: x = east, y = north) ----------
const EYE = 1.6;
const STOPS = {
  living_a:      {name:'Living room',            x:1.8, y:5.9,  head:0,
    links:[{to:'living_garden'},{to:'dining', via:[1.8,7.6]}]},
  living_garden: {name:'Living room - garden door', x:1.6, y:4.75, head:180,
    links:[{to:'living_a'},{to:'deck', via:[1.6,4.0]}]},
  dining:        {name:'Dining and entry',       x:3.5, y:8.9,  head:270,
    links:[{to:'living_a', via:[1.8,7.6]},{to:'hall_w'}]},
  hall_w:        {name:'Hallway (west)',         x:5.6, y:8.1,  head:90,
    links:[{to:'dining'},{to:'kitchen_a'},{to:'gaming', via:[5.4,7.5]},{to:'hall_e'}]},
  kitchen_a:     {name:'Kitchen',                x:5.8, y:9.45, head:0,
    links:[{to:'hall_w'},{to:'hall_e'}]},
  hall_e:        {name:'Hallway (east)',         x:6.9, y:8.2,  head:270,
    links:[{to:'hall_w'},{to:'kitchen_a'},{to:'bedroom', via:[7.3,7.5]},{to:'bath', via:[7.9,8.1]}]},
  gaming:        {name:'Gaming room',            x:5.4, y:6.5,  head:180,
    links:[{to:'hall_w', via:[5.4,7.5]}]},
  bedroom:       {name:'Bedroom',                x:7.9, y:6.9,  head:200,
    links:[{to:'hall_e', via:[7.3,7.5]}]},
  bath:          {name:'Bathroom',               x:8.9, y:8.4,  head:270,
    links:[{to:'hall_e', via:[7.9,8.1]}]},
  deck:          {name:'Garden - deck',          x:1.6, y:3.45, head:0,
    links:[{to:'living_garden', via:[1.6,4.0]},{to:'gate', via:[1.1,2.0]}]},
  gate:          {name:'Garden - gate',          x:1.05, y:1.0, head:0, z:0.72,
    links:[{to:'deck', via:[1.1,2.0]}]}
};
const START = 'living_a';

// ---------- renderer ----------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.autoClear = false;
renderer.outputEncoding = THREE.sRGBEncoding;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, 1, 0.1, 2000);
scene.add(camera);

// sphere with explicit equirect mapping: forward (three -z) = north, +x = east
function makePanoSphere(R, N, M) {
  const pos=[], uv=[], idx=[];
  for (let j=0;j<=M;j++) {
    const lat = Math.PI/2 - Math.PI*j/M;
    for (let i=0;i<=N;i++) {
      const lon = -Math.PI + 2*Math.PI*i/N;
      const wx=Math.cos(lat)*Math.sin(lon), wy=Math.cos(lat)*Math.cos(lon), wz=Math.sin(lat);
      pos.push(wx*R, wz*R, -wy*R);
      uv.push(i/N, 1-j/M);
    }
  }
  for (let j=0;j<M;j++) for (let i=0;i<N;i++) {
    const a=j*(N+1)+i, b=a+N+1;
    idx.push(a,b,a+1, b,b+1,a+1);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx);
  return g;
}
const panoMat = new THREE.MeshBasicMaterial({color:0xffffff, side:THREE.DoubleSide, depthWrite:false});
const pano = new THREE.Mesh(makePanoSphere(500, 96, 48), panoMat);
pano.renderOrder = 0;
scene.add(pano);

// textures
const loader = new THREE.TextureLoader();
const cache = {};
function getTex(id) {
  if (cache[id]) return cache[id];
  cache[id] = new Promise((res, rej) => loader.load('pano/'+id+'.jpg', t => {
    t.generateMipmaps=false; t.minFilter=THREE.LinearFilter; t.magFilter=THREE.LinearFilter;
    t.encoding = THREE.sRGBEncoding; res(t);
  }, undefined, rej));
  return cache[id];
}

// ---------- hotspots ----------
const hotspotGroup = new THREE.Group();
scene.add(hotspotGroup);
let hotspots = [];
function makeLabel(text) {
  const c = document.createElement('canvas'); c.width=512; c.height=96;
  const x = c.getContext('2d');
  x.fillStyle='rgba(0,0,0,.6)'; x.beginPath(); x.roundRect ? x.roundRect(4,8,504,80,20) : x.rect(4,8,504,80); x.fill();
  x.fillStyle='#fff'; x.font='bold 44px sans-serif'; x.textAlign='center'; x.textBaseline='middle'; x.fillText(text,256,50);
  const t = new THREE.CanvasTexture(c);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({map:t, depthTest:false, transparent:true}));
  s.scale.set(26,4.9,1); s.renderOrder=11;
  return s;
}
function buildHotspots(id) {
  hotspots.forEach(h => hotspotGroup.remove(h.group));
  hotspots = [];
  const s = STOPS[id];
  s.links.forEach(l => {
    const t = STOPS[l.to];
    const tx = l.via ? l.via[0] : t.x, ty = l.via ? l.via[1] : t.y;
    const dx = tx-s.x, dy = ty-s.y, dist = Math.hypot(dx,dy);
    const lon = Math.atan2(dx, dy);
    const el = -Math.atan2(EYE, Math.min(Math.max(dist,1.6), 3.6));
    const R = 60;
    const g = new THREE.Group();
    g.position.set(Math.sin(lon)*Math.cos(el)*R, Math.sin(el)*R, -Math.cos(lon)*Math.cos(el)*R);
    g.lookAt(0,0,0);
    const ring = new THREE.Mesh(new THREE.RingGeometry(3.2,4,48), new THREE.MeshBasicMaterial({color:0xffffff, transparent:true, opacity:.95, depthTest:false}));
    const disc = new THREE.Mesh(new THREE.CircleGeometry(3.2,48), new THREE.MeshBasicMaterial({color:0x2e8bff, transparent:true, opacity:.35, depthTest:false}));
    const fill = new THREE.Mesh(new THREE.CircleGeometry(3.2,48), new THREE.MeshBasicMaterial({color:0xffffff, transparent:true, opacity:.8, depthTest:false}));
    fill.scale.set(.001,.001,1); fill.position.z = .01;
    ring.renderOrder=10; disc.renderOrder=9; fill.renderOrder=10;
    g.add(disc, ring, fill);
    const lab = makeLabel(t.name); lab.position.set(0, 0, 0); g.add(lab);
    // label above the ring, in the ring's own up direction
    lab.position.y = 7;
    hotspotGroup.add(g);
    hotspots.push({group:g, fill, to:l.to, mesh:disc, ring});
  });
}

// ---------- gaze reticle (child of camera) ----------
const reticle = new THREE.Mesh(new THREE.RingGeometry(0.008,0.014,32), new THREE.MeshBasicMaterial({color:0xffffff, depthTest:false, transparent:true, opacity:.9}));
reticle.position.z = -1; reticle.renderOrder = 20; reticle.visible = false;
camera.add(reticle);

// ---------- view control ----------
let yaw = 0, pitch = 0;               // touch mode (radians)
let gyroOn = false, vrOn = false;
const devQ = new THREE.Quaternion(), offQ = new THREE.Quaternion();
let devAlpha=0, devBeta=0, devGamma=0, haveDev=false, yawOffset=0;
const _e = new THREE.Euler(), _q1 = new THREE.Quaternion(-Math.sqrt(0.5),0,0,Math.sqrt(0.5)), _q0 = new THREE.Quaternion(), _z = new THREE.Vector3(0,0,1);
function screenAngle(){ return (screen.orientation && screen.orientation.angle != null ? screen.orientation.angle : (window.orientation||0)) * Math.PI/180; }
function deviceQuat(out){
  _e.set(devBeta*Math.PI/180, devAlpha*Math.PI/180, -devGamma*Math.PI/180, 'YXZ');
  out.setFromEuler(_e); out.multiply(_q1); out.multiply(_q0.setFromAxisAngle(_z, -screenAngle()));
  return out;
}
window.addEventListener('deviceorientation', e => {
  if (e.alpha == null) return;
  devAlpha=e.alpha; devBeta=e.beta; devGamma=e.gamma; haveDev=true;
});
function currentYawOfDevice(){
  deviceQuat(devQ);
  const f = new THREE.Vector3(0,0,-1).applyQuaternion(devQ);
  return Math.atan2(f.x, -f.z);
}
function calibrate(headDeg){
  if (!haveDev) return;
  yawOffset = headDeg*Math.PI/180 - currentYawOfDevice();
}
function applyView(){
  if (gyroOn && haveDev) {
    deviceQuat(devQ);
    offQ.setFromAxisAngle(new THREE.Vector3(0,1,0), -yawOffset);
    camera.quaternion.copy(offQ).multiply(devQ);
  } else {
    camera.rotation.set(pitch, -yaw, 0, 'YXZ');
  }
}

// touch/mouse drag
let dragging=false, moved=false, lx=0, ly=0;
canvas.addEventListener('pointerdown', e => { dragging=true; moved=false; lx=e.clientX; ly=e.clientY; });
window.addEventListener('pointerup', e => {
  if (dragging && !moved && !vrOn) { if (walkMode) tapWalk(e.clientX, e.clientY); else tapAt(e.clientX, e.clientY); }
  dragging=false;
});
window.addEventListener('pointermove', e => {
  if (!dragging || (gyroOn && haveDev)) return;
  const dx=e.clientX-lx, dy=e.clientY-ly; lx=e.clientX; ly=e.clientY;
  if (Math.abs(dx)+Math.abs(dy) > 1) moved = true;
  const k = camera.fov/ (canvas.clientHeight||600) * Math.PI/180;
  yaw -= dx*k; pitch = Math.max(-1.45, Math.min(1.45, pitch + dy*k));
});
const ray = new THREE.Raycaster();
function tapAt(px, py){
  ray.setFromCamera(new THREE.Vector2(px/innerWidth*2-1, -(py/innerHeight*2-1)), camera);
  const hit = ray.intersectObjects(hotspots.map(h=>h.mesh), false)[0];
  if (hit) { const h = hotspots.find(h=>h.mesh===hit.object); if (h) go(h.to); }
}

// ---------- navigation ----------
let current = null, busy = false;
const fade = document.getElementById('fade');
const titleEl = document.getElementById('title');
async function go(id, first){
  if (walkMode) leaveWalk();
  if (busy || id === current) return;
  busy = true;
  if (!first) { fade.style.opacity = 1; await new Promise(r=>setTimeout(r, 360)); }
  const tex = await getTex(id);
  panoMat.map = tex; panoMat.needsUpdate = true;
  current = id;
  const s = STOPS[id];
  titleEl.textContent = s.name;
  buildHotspots(id);
  if (first) { yaw = s.head*Math.PI/180; pitch = 0; if (gyroOn) calibrate(s.head); }
  fade.style.opacity = 0;
  busy = false;
  gazeT = 0; gazeTarget = null;
  STOPS[id].links.forEach(l => getTex(l.to));   // preload neighbours
}

// ---------- gaze selection ----------
const DWELL = 1.5;
let gazeT = 0, gazeTarget = null;
function updateGaze(dt){
  const gazeActive = vrOn || (gyroOn && haveDev);
  reticle.visible = gazeActive && !vrOn ? true : vrOn;
  if (walkMode) { gazeTarget = null; return; }
  if (!gazeActive || busy) return;
  ray.setFromCamera(new THREE.Vector2(0,0), camera);
  const hit = ray.intersectObjects(hotspots.map(h=>h.mesh), false)[0];
  const h = hit && hotspots.find(h=>h.mesh===hit.object);
  if (h) {
    if (gazeTarget !== h) { if (gazeTarget) gazeTarget.fill.scale.set(.001,.001,1); gazeTarget = h; gazeT = 0; }
    gazeT += dt;
    const p = Math.min(1, gazeT/DWELL);
    h.fill.scale.set(Math.max(.001,p), Math.max(.001,p), 1);
    if (gazeT >= DWELL) { const to = h.to; gazeTarget = null; gazeT = 0; go(to); }
  } else if (gazeTarget) { gazeTarget.fill.scale.set(.001,.001,1); gazeTarget = null; gazeT = 0; }
}

// ---------- UI ----------
const bGyro = document.getElementById('bGyro'), bVR = document.getElementById('bVR'), bMenu = document.getElementById('bMenu'), menu = document.getElementById('menu');
async function enableGyro(){
  try {
    if (typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission) {
      const r = await DeviceOrientationEvent.requestPermission(); if (r !== 'granted') return false;
    }
  } catch(e){ return false; }
  gyroOn = true; bGyro.classList.add('on');
  setTimeout(()=>calibrate(STOPS[current].head), 400);
  return true;
}
function disableGyro(){ gyroOn = false; bGyro.classList.remove('on'); }
bGyro.onclick = async () => { gyroOn ? disableGyro() : await enableGyro(); };
bVR.onclick = async () => {
  if (!vrOn) {
    if (!gyroOn) await enableGyro();
    vrOn = true; document.body.classList.add('vr'); bVR.classList.add('on');
    try { await document.documentElement.requestFullscreen(); } catch(e){}
    try { await screen.orientation.lock('landscape'); } catch(e){}
    try { navigator.wakeLock && navigator.wakeLock.request('screen'); } catch(e){}
    camera.fov = 90; menu.style.display='none';
  } else exitVR();
};
function exitVR(){
  vrOn = false; document.body.classList.remove('vr'); bVR.classList.remove('on'); reticle.visible=false;
  camera.fov = 75; if (walkMode) document.getElementById('walkpad').style.display = 'flex';
  if (document.fullscreenElement) document.exitFullscreen().catch(()=>{});
  try { screen.orientation.unlock(); } catch(e){}
  resize();
}
// escape hatch inside the headset: double-tap the screen
let lastTap = 0;
window.addEventListener('touchend', () => {
  const n = Date.now();
  if (walkMode && hoverIt && (vrOn || gyroOn)) { toggleInter(hoverIt); lockIt = hoverIt; dwell = 0; lastTap = 0; return; }   // tap while looking at an object = use it now
  if (gazeTarget && (vrOn || gyroOn)) { const to = gazeTarget.to; gazeTarget = null; gazeT = 0; go(to); lastTap = 0; return; }   // tap while looking at a ring = go now
  if (vrOn && n-lastTap < 350) exitVR();
  lastTap = n;
});
document.addEventListener('fullscreenchange', () => { if (vrOn && !document.fullscreenElement) exitVR(); });
bMenu.onclick = () => { menu.style.display = menu.style.display==='block' ? 'none' : 'block'; };
Object.entries(STOPS).forEach(([id,s]) => { const d=document.createElement('div'); d.textContent=s.name; d.onclick=()=>{ menu.style.display='none'; if (walkMode && WALKABLE(id)) teleportTo(id); else go(id); }; menu.appendChild(d); });

// ---- eye spacing (Cardboard lenses are ~6.2 cm apart; the half-screens of a phone are usually further apart than that)
let eyeAdj = Number(localStorage.getItem('eyeAdj') || 0);
function eyeShift(){
  const wcm = Math.max(innerWidth, innerHeight) / 160 * 2.54;            // approx physical screen width in cm (1 CSS px = 1/160 in on Android)
  const base = ((wcm/2 - 6.2) / 2) / 2.54 * 160;                         // px each picture must move inwards
  return Math.max(0, base + eyeAdj);
}
const bClose = document.getElementById('bClose'), bApart = document.getElementById('bApart');
function showAdj(){ bClose.textContent = 'Eyes closer'; bApart.textContent = 'Eyes apart (' + Math.round(eyeShift()) + ')'; }
bClose.onclick = () => { eyeAdj += 6; localStorage.setItem('eyeAdj', eyeAdj); showAdj(); };
bApart.onclick = () => { eyeAdj -= 6; localStorage.setItem('eyeAdj', eyeAdj); showAdj(); };
showAdj();

function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = vrOn ? (w/2)/h : w/h; camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize); resize();

// ================= WALK MODE (real 3D model + collisions + tilt-to-walk) =================
let EYE_H = Number(localStorage.getItem('eyeH') || 1.60);                      // 1.60 = 170 cm person, 1.49 = 159 cm person
const BODY_R = 0.16, IPD = 0.064;
const TILT_START = 28, TILT_FULL = 55, MAX_SPEED = 0.8, MIN_SPEED = 0.2;      // look down 28..55 deg => walk forward, 0.2..0.8 m/s
const WALK_BOUNDS = {x0:0.12, x1:10.06, y0:0.12, y1:10.62};                    // apartment + garden, inside the fence
let walkMode = false, house = null, houseLoading = false, walkLight = [], ceilingMesh = null, groundMesh = null;
let wx = 5.6, wy = 8.1;                                                         // plan position (x east, y north), metres
let grid = null;
const bWalk = document.getElementById('bWalk');
const bHeight = document.getElementById('bHeight');
function showHeight(){ bHeight.textContent = 'Height: ' + (EYE_H > 1.55 ? '170 cm' : '159 cm'); }
bHeight.onclick = () => { EYE_H = EYE_H > 1.55 ? 1.49 : 1.60; localStorage.setItem('eyeH', EYE_H); showHeight(); if (walkMode) placeCamera(); };
showHeight();
function WALKABLE(id){ return !!STOPS[id]; }
let wz = 0;                                                                     // current ground height under the player
function groundAt(x, y){
  const ix = Math.floor((x-grid.x0)/grid.cell), iy = Math.floor((y-grid.y0)/grid.cell);
  if (ix<0||iy<0||ix>=grid.nx||iy>=grid.ny) return 0;
  return grid.ground[iy*grid.nx+ix] / 100;
}

async function loadCollision(){
  if (grid) return grid;
  const j = await (await fetch('collision.json')).json();
  const bin = atob(j.bits), bytes = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  const gb = atob(j.ground), gbytes = new Uint8Array(gb.length);
  for (let i=0;i<gb.length;i++) gbytes[i] = gb.charCodeAt(i);
  const ground = new Int16Array(gbytes.buffer);
  grid = { cell:j.cell, x0:j.x0, y0:j.y0, nx:j.nx, ny:j.ny, bytes, ground };
  return grid;
}
function cellBlocked(x, y){
  const ix = Math.floor((x-grid.x0)/grid.cell), iy = Math.floor((y-grid.y0)/grid.cell);
  if (ix<0||iy<0||ix>=grid.nx||iy>=grid.ny) return true;
  const i = iy*grid.nx+ix; return (grid.bytes[i>>3] >> (i&7)) & 1;
}
function ptBlocked(x, y){ return cellBlocked(x,y) || gateBlocked(x,y); }
function blockedAt(x, y){
  if (x<WALK_BOUNDS.x0||x>WALK_BOUNDS.x1||y<WALK_BOUNDS.y0||y>WALK_BOUNDS.y1) return true;
  if (ptBlocked(x,y)) return true;
  for (let k=0;k<12;k++){ const a=k*Math.PI/6; if (ptBlocked(x+Math.cos(a)*BODY_R, y+Math.sin(a)*BODY_R)) return true; }
  return false;
}
function nearestFree(x, y){
  if (!blockedAt(x,y)) return [x,y];
  for (let r=0.05; r<2.5; r+=0.05) for (let k=0;k<24;k++){ const a=k*Math.PI/12, px=x+Math.cos(a)*r, py=y+Math.sin(a)*r; if (!blockedAt(px,py)) return [px,py]; }
  return [x,y];
}
function stepOk(x, y){ return Math.abs(groundAt(x,y) - groundAt(wx,wy)) <= 0.3; }   // no jumping up/down more than 30 cm
function tryMove(dx, dy){
  const nx = wx+dx, ny = wy+dy;
  if (!blockedAt(nx,ny) && stepOk(nx,ny)) { wx=nx; wy=ny; return; }
  if (!blockedAt(nx,wy) && stepOk(nx,wy)) { wx=nx; return; }       // slide along walls
  if (!blockedAt(wx,ny) && stepOk(wx,ny)) { wy=ny; return; }
}
function placeCamera(dt){
  const target = groundAt(wx, wy);
  wz = dt ? wz + (target - wz) * Math.min(1, dt*8) : target;       // smooth steps on the stairs
  camera.position.set(wx, wz + EYE_H, -wy);
}

// ---------- interactive objects (doors, drawers, cabinet doors) ----------
const INT_DWELL = 1.2, INT_REACH = 2.6;
const MODELLED_OPEN = new Set(['office_door','bath_door','bedroom_door']);     // these are modelled open; everything else is modelled closed
let inter = [], interById = {}, gateList = [], interMeshes = [], houseMeshes = [];
let hoverIt = null, lockIt = null, dwell = 0, occT = 0, occluded = false;
const easeT = t => t*t*(3-2*t);
function isOpen(it){ return MODELLED_OPEN.has(it.id) ? it.target < 0.5 : it.target > 0.5; }
function gateBlocked(x, y){
  for (const g of gateList) { const r = g.rect; if (x>=r[0] && x<=r[1] && y>=r[2] && y<=r[3] && g.blocked()) return true; }
  return false;
}
function applyPose(it){
  const e = easeT(it.t);
  if (it.type === 'hinge') it.pivot3.rotation.y = THREE.MathUtils.degToRad(it.delta) * e;
  else it.pivot3.position.set(it.base.x + it.delta[0]*e, it.base.y, it.base.z - it.delta[1]*e);
}
async function setupInteractions(){
  inter = []; interById = {}; gateList = []; interMeshes = []; houseMeshes = [];
  let man = []; try { man = await (await fetch('interactions.json')).json(); } catch(e){ return; }
  const gateGroups = [];
  for (const e of man) {
    if (e.gateGroup) { gateGroups.push(e); continue; }
    const obj = house.getObjectByName('INT_' + e.id); if (!obj) continue;
    const base = e.pivot ? new THREE.Vector3(e.pivot[0] + 10, 0, -e.pivot[1]) : new THREE.Vector3(0,0,0);   // house-local (model x has +10 offset)
    const pv = new THREE.Group(); pv.position.copy(base);
    obj.parent.remove(obj); obj.position.set(-base.x, -base.y, -base.z); pv.add(obj); house.add(pv);
    const it = { id:e.id, label:e.label, type:e.type, delta:e.delta, group:e.group||null, pivot3:pv, base:base.clone(), t:0, target:0 };
    inter.push(it); interById[e.id] = it;
    obj.traverse(o => { if (o.isMesh) { o.userData.intIndex = inter.length-1; interMeshes.push(o); } });
    if (e.gate && e.gate.closedBlocks) gateList.push({ rect:e.gate.rect, blocked:() => !isOpen(it) });
  }
  for (const g of gateGroups) gateList.push({ rect:g.rect, blocked:() => g.needsOpen.some(id => interById[id] && !isOpen(interById[id])) });
  house.traverse(o => { if (o.isMesh && o.userData.intIndex === undefined) houseMeshes.push(o); });
  console.log('interactive objects:', inter.length, 'gates:', gateList.length);
}
function toggleInter(it){
  const nt = it.target > 0.5 ? 0 : 1;
  inter.forEach(o => { if (o === it || (it.group && o.group === it.group)) o.target = nt; });
}
function setEmissive(it, on){
  if (!it) return;
  const idx = inter.indexOf(it);
  interMeshes.forEach(m => { if (m.userData.intIndex === idx) m.material.emissive.setHex(on ? 0x26466e : 0x000000); });
}
// gaze label + fill, attached to the camera so both eyes see them
const labelCanvas = document.createElement('canvas'); labelCanvas.width = 512; labelCanvas.height = 96;
const labelTex = new THREE.CanvasTexture(labelCanvas);
const labelSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map:labelTex, depthTest:false, transparent:true }));
labelSprite.scale.set(0.34, 0.064, 1); labelSprite.position.set(0, -0.085, -1); labelSprite.renderOrder = 22; labelSprite.visible = false; camera.add(labelSprite);
const fillDisc = new THREE.Mesh(new THREE.CircleGeometry(0.02, 32), new THREE.MeshBasicMaterial({ color:0x6fb6ff, depthTest:false, transparent:true, opacity:.8 }));
fillDisc.position.z = -1; fillDisc.renderOrder = 21; fillDisc.visible = false; camera.add(fillDisc);
function setLabel(text){
  const x = labelCanvas.getContext('2d'); x.clearRect(0,0,512,96);
  x.fillStyle = 'rgba(0,0,0,.65)'; x.fillRect(4,10,504,76); x.fillStyle = '#fff'; x.font = 'bold 40px sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(text, 256, 50);
  labelTex.needsUpdate = true;
}
function hoverLabel(it){ return it.label + ' - ' + (isOpen(it) ? 'look to close' : 'look to open'); }
function updateInteract(dt){
  for (const it of inter) { const d = it.target - it.t; if (Math.abs(d) > 1e-4) { it.t += Math.sign(d) * Math.min(Math.abs(d), dt/0.8); applyPose(it); } }
  if (!walkMode || !inter.length) { fillDisc.visible = labelSprite.visible = false; return; }
  const active = vrOn || (gyroOn && haveDev);
  let it = null, hitDist = 0;
  if (active) {
    ray.setFromCamera(new THREE.Vector2(0,0), camera); ray.far = INT_REACH;
    const hit = ray.intersectObjects(interMeshes, false)[0]; ray.far = Infinity;
    if (hit) { it = inter[hit.object.userData.intIndex]; hitDist = hit.distance; occT -= dt;
      if (occT <= 0) { occT = 0.25; const r2 = ray.intersectObjects(houseMeshes, false)[0]; occluded = !!(r2 && r2.distance < hitDist - 0.05); }
      if (occluded) it = null; }
  }
  if (lockIt && it !== lockIt) lockIt = null;
  if (it !== hoverIt) { setEmissive(hoverIt, false); hoverIt = it; dwell = 0; if (it) { setEmissive(it, true); setLabel(hoverLabel(it)); } }
  if (it && it !== lockIt) {
    dwell += dt; fillDisc.visible = true; labelSprite.visible = true;
    const p = Math.min(1, dwell / INT_DWELL); fillDisc.scale.set(Math.max(.01,p), Math.max(.01,p), 1);
    if (dwell >= INT_DWELL) { toggleInter(it); lockIt = it; dwell = 0; setLabel(it.label + ' - ' + (isOpen(it) ? 'open' : 'closed')); }
  } else { fillDisc.visible = false; labelSprite.visible = !!it; }
}
function tapWalk(px, py){
  if (!inter.length) return false;
  ray.setFromCamera(new THREE.Vector2(px/innerWidth*2-1, -(py/innerHeight*2-1)), camera); ray.far = INT_REACH + 0.6;
  const hit = ray.intersectObjects(interMeshes, false)[0]; ray.far = Infinity;
  if (!hit) return false;
  const r2 = ray.intersectObjects(houseMeshes, false)[0]; if (r2 && r2.distance < hit.distance - 0.05) return false;
  toggleInter(inter[hit.object.userData.intIndex]); return true;
}

async function loadHouse(){
  if (house || houseLoading) return;
  houseLoading = true;
  const loading = document.getElementById('loading'); loading.textContent = 'Loading 3D model...'; loading.style.display = 'flex';
  await loadCollision();
  await new Promise((res, rej) => new THREE.GLTFLoader().load('house.glb', gltf => {
    house = gltf.scene; house.position.x = -10;                               // model x includes a +10 m offset
    house.traverse(o => { if (o.isMesh) {
      const m = o.material, nm = new THREE.MeshPhongMaterial({ color: m.color ? m.color.clone() : 0xffffff, map: m.map || null, side: THREE.DoubleSide, flatShading: true, specular: 0x000000, shininess: 0 });
      if (m.transparent || m.opacity < 1) { nm.transparent = true; nm.opacity = m.opacity; nm.depthWrite = false; }
      if (m.alphaTest) nm.alphaTest = m.alphaTest;
      o.material = nm; o.frustumCulled = true;
    }});
    house.visible = false; scene.add(house);
    // flat ceiling for the apartment (z = 2.70 m)
    const cg = new THREE.PlaneGeometry(10.16, 7.0); cg.rotateX(Math.PI/2);
    ceilingMesh = new THREE.Mesh(cg, new THREE.MeshBasicMaterial({ color: 0xe9e6df, side: THREE.DoubleSide }));
    ceilingMesh.position.set(5.08, 2.70, -7.5); ceilingMesh.visible = false; scene.add(ceilingMesh);
    // outdoor ground (lawn / street level at -0.90 m) and lights
    const gg = new THREE.PlaneGeometry(300, 300); gg.rotateX(-Math.PI/2);
    groundMesh = new THREE.Mesh(gg, new THREE.MeshBasicMaterial({ color: 0x9aa98b })); groundMesh.position.set(5, -0.905, -5); groundMesh.visible = false; scene.add(groundMesh);
    const amb = new THREE.AmbientLight(0xffffff, 0.62), sun = new THREE.DirectionalLight(0xffffff, 0.4); sun.position.set(-3, 8, 4);
    amb.visible = sun.visible = false; scene.add(amb, sun); walkLight = [amb, sun];
    res();
  }, undefined, rej));
  await setupInteractions();
  loading.style.display = 'none'; houseLoading = false;
}
async function enterWalk(){
  try { await loadHouse(); } catch(e){ document.getElementById('loading').textContent = '3D model failed to load'; setTimeout(()=>document.getElementById('loading').style.display='none', 2500); houseLoading=false; return; }
  walkMode = true;
  let sx = 5.6, sy = 8.1; const cs = STOPS[current]; if (cs && WALKABLE(current)) { sx = cs.x; sy = cs.y; }
  [wx, wy] = nearestFree(sx, sy); placeCamera();
  pano.visible = false; hotspotGroup.visible = false; house.visible = true; ceilingMesh.visible = true; groundMesh.visible = true; walkLight.forEach(l => l.visible = true);
  scene.background = new THREE.Color(0xbcd3e6); camera.far = 200; camera.near = 0.05; camera.updateProjectionMatrix();
  bWalk.classList.add('on'); bWalk.textContent = 'Panoramas'; titleEl.textContent = 'Walking - look down to walk';
  document.getElementById('walkpad').style.display = vrOn ? 'none' : 'flex';
}
function leaveWalk(){
  walkMode = false; setEmissive(hoverIt, false); hoverIt = null; lockIt = null;
  if (house) house.visible = false; if (ceilingMesh) ceilingMesh.visible = false; if (groundMesh) groundMesh.visible = false; walkLight.forEach(l => l.visible = false);
  pano.visible = true; hotspotGroup.visible = true; scene.background = null;
  camera.position.set(0,0,0); camera.far = 2000; camera.near = 0.1; camera.updateProjectionMatrix();
  bWalk.classList.remove('on'); bWalk.textContent = 'Walk (3D)';
  document.getElementById('walkpad').style.display = 'none';
  if (current) titleEl.textContent = STOPS[current].name;
}
function teleportTo(id){ const s = STOPS[id]; [wx, wy] = nearestFree(s.x, s.y); placeCamera(); }
bWalk.onclick = async () => {
  if (walkMode) {
    // back to the panorama stop nearest to where you are standing
    let best = null, bd = 1e9; for (const [id,s] of Object.entries(STOPS)) { if (!WALKABLE(id)) continue; const d = Math.hypot(s.x-wx, s.y-wy); if (d < bd) { bd = d; best = id; } }
    const keep = current; current = null; await go(best || keep);
  } else await enterWalk();
};
// on-screen / keyboard walking (for when you are not in the headset)
const keys = {}; let padF = 0, padB = 0;
window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
const walkpad = document.getElementById('walkpad');
[['wpF', v => padF = v], ['wpB', v => padB = v]].forEach(([id, set]) => {
  const b = document.getElementById(id);
  b.addEventListener('pointerdown', e => { e.stopPropagation(); set(1); }); 
  ['pointerup','pointerleave','pointercancel'].forEach(ev => b.addEventListener(ev, () => set(0)));
});
const _dir = new THREE.Vector3();
function updateWalk(dt){
  if (!walkMode || !grid) return;
  if (gateBlocked(wx, wy)) [wx, wy] = nearestFree(wx, wy);          // a door closed on you: step out
  camera.getWorldDirection(_dir);
  let fx = _dir.x, fy = -_dir.z; const fl = Math.hypot(fx, fy) || 1; fx /= fl; fy /= fl;     // facing direction on the floor plan
  const pitchDeg = Math.asin(Math.max(-1, Math.min(1, _dir.y))) * 180/Math.PI;
  let v = 0;
  if ((gyroOn && haveDev) || vrOn) {
    if (pitchDeg < -TILT_START) { const t = Math.min(1, (-pitchDeg - TILT_START)/(TILT_FULL - TILT_START)); v = MIN_SPEED + (MAX_SPEED - MIN_SPEED) * t; }
  }
  if (keys['w'] || keys['arrowup'] || padF) v = 0.9;
  if (keys['s'] || keys['arrowdown'] || padB) v = -0.7;
  let sx = 0; if (keys['a']) sx = -0.7; if (keys['d']) sx = 0.7;
  if (v || sx) tryMove((fx*v + fy*sx)*dt, (fy*v - fx*sx)*dt);
  placeCamera(dt);
}

let last = performance.now();
function frame(now){
  const dt = Math.min(.1, (now-last)/1000); last = now;
  applyView(); updateGaze(dt); updateWalk(dt); updateInteract(dt);
  // three.js viewport/scissor are in CSS pixels (it multiplies by the pixel ratio itself)
  const w = innerWidth, h = innerHeight;
  renderer.setScissorTest(true); renderer.clear();
  if (vrOn) {
    camera.aspect = (innerWidth/2)/innerHeight; camera.updateProjectionMatrix();
    // shift each eye's picture towards the middle so the two image centres sit one eye-spacing apart (avoids double vision)
    const d = eyeShift();
    const off = walkMode ? IPD/2 : 0;     // real stereo depth in the 3D walk mode
    if (off) camera.translateX(-off);
    renderer.setViewport(d,0,w/2,h);     renderer.setScissor(0,0,w/2,h);   renderer.render(scene,camera);
    if (off) camera.translateX(2*off);
    renderer.setViewport(w/2-d,0,w/2,h); renderer.setScissor(w/2,0,w/2,h); renderer.render(scene,camera);
    if (off) camera.translateX(-off);
  } else {
    camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
    renderer.setViewport(0,0,w,h); renderer.setScissor(0,0,w,h); renderer.render(scene,camera);
  }
  requestAnimationFrame(frame);
}
go(START, true).then(() => { document.getElementById('loading').style.display='none'; requestAnimationFrame(frame); });
</script>
